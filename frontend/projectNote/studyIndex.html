<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2c8a6" />
    <title>学习项目 | 咿呀喵呜の博客</title>
    <style>
      :root {
        --ink: #2b2337;
        --ink-soft: #4c4259;
        --accent: #6b4fa0;
        /* div 顶部渐隐高度，同时作为内容顶部留白 */
        --sheet-fade: clamp(72px, 9vh, 96px);
        --page-top: 22vh;
        --page-top: 22dvh;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
        background-color: #150f22;
        background-image:
          radial-gradient(
            120% 90% at 72% 0%,
            rgba(255, 158, 112, 0.18),
            transparent 62%
          ),
          radial-gradient(
            100% 80% at 8% 100%,
            rgba(107, 79, 160, 0.24),
            transparent 60%
          ),
          linear-gradient(160deg, #150f22 0%, #241731 48%, #3f2130 100%);
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family:
          system-ui,
          -apple-system,
          "PingFang SC",
          "Microsoft YaHei",
          "Noto Sans SC",
          sans-serif;
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
      }

      /* 和首页一致的固定背景图 */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image: url("../../doc/background/background_temp.jpg");
        background-size: cover;
        background-position: 42% 45%;
        background-repeat: no-repeat;
        pointer-events: none;
      }

      /* 顶部菜单栏，保持首页的样式 */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        padding:
          calc(env(safe-area-inset-top) + 10px)
          max(16px, env(safe-area-inset-right))
          10px
          max(16px, env(safe-area-inset-left));
        background: linear-gradient(
          180deg,
          rgba(22, 14, 32, 0.58) 0%,
          rgba(22, 14, 32, 0.3) 70%,
          rgba(22, 14, 32, 0) 100%
        );
        color: #f7f1e8;
      }

      .brand {
        font-size: clamp(30px, 7.6vw, 34px);
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #f7f1e8;
        text-decoration: none;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(10, 5, 18, 0.35);
      }

      .brand-suffix {
        color: rgba(247, 241, 232, 0.72);
        font-weight: 600;
      }

      .topnav {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .topnav a {
        padding: 7px 10px;
        border-radius: 999px;
        font-size: clamp(13px, 3.4vw, 14.5px);
        color: rgba(247, 241, 232, 0.88);
        text-decoration: none;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(10, 5, 18, 0.35);
        transition:
          background 0.2s,
          color 0.2s;
      }

      .topnav a:focus-visible {
        outline: 2px solid #f7f1e8;
        outline-offset: 2px;
      }

      @media (hover: hover) and (pointer: fine) {
        .topnav a:hover {
          background: rgba(255, 255, 255, 0.16);
          color: #fff;
        }
      }

      /* 上方留一点背景图，下面是大区块 */
      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100dvh;
        padding-top: var(--page-top);
      }

      .card {
        min-height: calc(100vh - var(--page-top));
        min-height: calc(100dvh - var(--page-top));
        padding:
          var(--sheet-fade)
          max(clamp(22px, 5vw, 72px), env(safe-area-inset-right))
          max(48px, env(safe-area-inset-bottom))
          max(clamp(22px, 5vw, 72px), env(safe-area-inset-left));
        background: linear-gradient(
          180deg,
          rgba(251, 247, 241, 0) 0%,
          rgba(251, 247, 241, 0.82) var(--sheet-fade),
          rgba(244, 237, 226, 0.82) 100%
        );
      }

      .notes {
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: var(--accent);
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 40px);
        line-height: 1.15;
        letter-spacing: 0.01em;
      }

      .meta {
        margin: 12px 0 24px;
        color: var(--ink-soft);
        font-size: 0.9rem;
      }

      .note-list {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid rgba(107, 79, 160, 0.14);
      }

      .note-list li {
        border-bottom: 1px solid rgba(107, 79, 160, 0.12);
      }

      .note-list a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 6px;
        border-radius: 8px;
        color: var(--ink);
        text-decoration: none;
        transition:
          background 0.2s,
          padding 0.2s;
      }

      .note-list a::before {
        content: "▸";
        color: var(--accent);
        font-size: 0.95em;
      }

      .note-list a:hover {
        background: rgba(107, 79, 160, 0.08);
        padding-left: 12px;
        padding-right: 12px;
      }

      .note-list a:active {
        background: rgba(107, 79, 160, 0.14);
      }

      .note-list a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .note-name {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: clamp(16px, 2.4vw, 18px);
        font-weight: 600;
      }

      .note-ext {
        color: var(--ink-soft);
        font-weight: 400;
      }

      .empty {
        margin: 18px 0 0;
        color: var(--ink-soft);
        font-size: 0.95rem;
      }

      @media (max-width: 350px) {
        .brand {
          font-size: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .note-list a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../../index.html">
        咿呀喵呜<span class="brand-suffix">の博客</span>
      </a>
      <nav class="topnav" aria-label="页头导航">
        <a href="../../index.html">首页</a>
      </nav>
    </header>

    <div class="backdrop" aria-hidden="true"></div>

    <main class="page">
      <section class="card" aria-labelledby="notes-title">
        <div class="notes">
          <p class="eyebrow">项目笔记 · 学习项目</p>
          <h1 id="notes-title">学习项目</h1>
          <p class="meta">
            共 <span id="note-count">0</span> 篇 · 点击文件名打开文章
          </p>
          <ul class="note-list" id="note-list"></ul>
          <p class="empty" id="note-empty" hidden>暂时还没有笔记。</p>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const FALLBACK = [];
        const REPO = "yiyamiaowu/yiyamiaowu.github.io";
        const BRANCH = "main";
        const FOLDER = "doc/study_project";

        const list = document.getElementById("note-list");
        const count = document.getElementById("note-count");
        const empty = document.getElementById("note-empty");

        const render = (files) => {
          const names = [...new Set(files)].sort((a, b) =>
            a.localeCompare(b, "en"),
          );
          list.replaceChildren();
          count.textContent = String(names.length);
          empty.hidden = names.length > 0;

          for (const name of names) {
            const base = name.replace(/\.html$/i, "");
            const ext = name.slice(base.length);

            const link = document.createElement("a");
            link.href =
              "../../" + FOLDER + "/" + encodeURIComponent(name);

            const label = document.createElement("span");
            label.className = "note-name";
            label.textContent = base;

            const extLabel = document.createElement("span");
            extLabel.className = "note-ext";
            extLabel.textContent = ext;
            label.append(extLabel);

            link.append(label);

            const item = document.createElement("li");
            item.append(link);
            list.append(item);
          }
        };

        /* 先用本地兜底列表，再从 GitHub 仓库读取完整文件列表 */
        render(FALLBACK);

        const load = async () => {
          try {
            const response = await fetch(
              `https://api.github.com/repos/${REPO}/contents/${FOLDER}?ref=${BRANCH}`,
              { headers: { Accept: "application/vnd.github+json" } },
            );
            if (!response.ok) return;
            const data = await response.json();
            if (!Array.isArray(data)) return;
            const files = data
              .filter(
                (item) =>
                  item.type === "file" && /\.html$/i.test(item.name),
              )
              .map((item) => item.name);
            if (files.length) render(files);
          } catch {
            /* 断网或 API 限流时保留本地列表 */
          }
        };

        load();
      })();
    </script>
  </body>
</html>
