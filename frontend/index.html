<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2c8a6" />
    <title>咿呀喵呜の博客</title>
    <style>
      :root {
        --ink: #2b2337;
        --ink-soft: #4c4259;
        --accent: #6b4fa0;
        /* div 顶部渐隐的高度，同时用来给内容留出顶部空间 */
        --sheet-fade: clamp(72px, 9vh, 96px);
        interpolate-size: allow-keywords;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
        /* 背景图加载前 / 加载失败时的备用底色 */
        background-color: #150f22;
        background-image:
          radial-gradient(
            120% 90% at 72% 0%,
            rgba(255, 158, 112, 0.18),
            transparent 62%
          ),
          radial-gradient(
            100% 80% at 8% 100%,
            rgba(107, 79, 160, 0.24),
            transparent 60%
          ),
          linear-gradient(160deg, #150f22 0%, #241731 48%, #3f2130 100%);
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family:
          system-ui,
          -apple-system,
          "PingFang SC",
          "Microsoft YaHei",
          "Noto Sans SC",
          sans-serif;
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
      }

      /* 固定铺满的背景图，内容区块向上滚动时会自然盖住它 */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image: url("../doc/background/background_temp.jpg");
        background-size: cover;
        background-position: 42% 45%;
        background-repeat: no-repeat;
        pointer-events: none;
      }

      /* 顶部菜单栏：固定在视窗最上方，用深色渐变保证文字可读 */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        padding: calc(env(safe-area-inset-top) + 10px)
          max(16px, env(safe-area-inset-right)) 10px
          max(16px, env(safe-area-inset-left));
        background: linear-gradient(
          180deg,
          rgba(22, 14, 32, 0.58) 0%,
          rgba(22, 14, 32, 0.3) 70%,
          rgba(22, 14, 32, 0) 100%
        );
        color: #f7f1e8;
      }

      .brand {
        font-size: clamp(30px, 7.6vw, 34px);
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #f7f1e8;
        text-decoration: none;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(10, 5, 18, 0.35);
      }

      .brand-suffix {
        color: rgba(247, 241, 232, 0.72);
        font-weight: 600;
      }

      .topnav {
        display: flex;
        align-items: center;
        gap: clamp(2px, 1.2vw, 8px);
      }

      .topnav a {
        padding: 7px 10px;
        border-radius: 999px;
        font-size: clamp(13px, 3.4vw, 14.5px);
        color: rgba(247, 241, 232, 0.88);
        text-decoration: none;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(10, 5, 18, 0.35);
        transition:
          background 0.2s,
          color 0.2s;
      }

      .topnav a:focus-visible {
        outline: 2px solid #f7f1e8;
        outline-offset: 2px;
      }

      @media (hover: hover) and (pointer: fine) {
        .topnav a:hover {
          background: rgba(255, 255, 255, 0.16);
          color: #fff;
        }
      }

      @media (max-width: 350px) {
        .brand {
          font-size: 24px;
        }
      }

      /* 首屏先显示大部分背景图，菜单区在下方；向下滚动时菜单区升上来盖住图片 */
      .page {
        position: relative;
        z-index: 1;
        padding-top: 100vh;
        padding-top: 65dvh;
      }

      /* 大区块：半透明，顶部用渐变融入背景图 */
      .card {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding: var(--sheet-fade)
          max(clamp(22px, 5vw, 72px), env(safe-area-inset-right))
          max(clamp(48px, 10vh, 96px), env(safe-area-inset-bottom))
          max(clamp(22px, 5vw, 72px), env(safe-area-inset-left));
        padding-top: max(
          var(--sheet-fade),
          calc(env(safe-area-inset-top) + 64px)
        );
        background: linear-gradient(
          180deg,
          rgba(251, 247, 241, 0) 0%,
          rgba(251, 247, 241, 0.82) var(--sheet-fade),
          rgba(244, 237, 226, 0.82) 100%
        );
      }

      .sheet-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(14px, 2.4vh, 22px);
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
      }

      ul {
        list-style: none;
        padding-left: 0;
        margin: 0;
      }

      .menu {
        width: 100%;
        max-width: 460px;
        margin-inline: auto;
        font-family: inherit;
        font-size: clamp(16px, 2.2vw, 18px);
      }

      details {
        margin: 0;
      }

      summary {
        padding: 11px 10px;
        border-radius: 12px;
        cursor: pointer;
        user-select: none;
        font-weight: 600;
        letter-spacing: 0.01em;
        list-style-position: inside;
        transition: background 0.2s;
      }

      summary::marker {
        color: var(--accent);
      }

      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      details::details-content {
        block-size: 0;
        overflow: hidden;
        transition:
          block-size 0.25s ease,
          content-visibility 0.25s ease;
        transition-behavior: allow-discrete;
      }

      details[open]::details-content {
        block-size: auto;
      }

      .sub {
        padding: 2px 0 8px 24px;
        color: var(--ink-soft);
      }

      .sub li {
        padding: 1px 0;
      }

      .sub a {
        display: block;
        padding: 9px 8px;
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .sub a:active {
        background: rgba(107, 79, 160, 0.12);
      }

      .sub a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* 触屏上加大点击区域，避免误触 */
      @media (pointer: coarse) {
        summary {
          padding: 13px 10px;
        }
        .sub a {
          padding: 11px 8px;
        }
      }

      @media (hover: hover) and (pointer: fine) {
        summary:hover {
          background: rgba(107, 79, 160, 0.08);
        }
        .sub a:hover {
          background: rgba(107, 79, 160, 0.08);
          color: var(--accent);
        }
      }

      /* 回到顶部：固定在视窗底部，向下滚动后才浮现 */
      .back-to-top {
        position: fixed;
        left: 50%;
        bottom: 20px;
        bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px));
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 20px;
        border-radius: 999px;
        font: inherit;
        font-size: 0.9rem;
        color: var(--accent);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(107, 79, 160, 0.28);
        box-shadow: 0 10px 26px -14px rgba(20, 10, 34, 0.5);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, 10px);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          visibility 0s linear 0.25s,
          background 0.2s;
        -webkit-tap-highlight-color: transparent;
      }

      .back-to-top.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translate(-50%, 0);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          visibility 0s,
          background 0.2s;
      }

      .back-to-top:active {
        transform: translate(-50%, 0) scale(0.97);
      }

      .back-to-top:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (hover: hover) and (pointer: fine) {
        .back-to-top:hover {
          background: #fff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .back-to-top {
          transition: none;
        }
      }
    </style>
  </head>
  <body id="top">
    <header class="topbar">
      <a class="brand" href="#top">
        咿呀喵呜<span class="brand-suffix">の博客</span>
      </a>
      <nav class="topnav" aria-label="页头导航">
        <a href="#top">首页</a>
        <a href="#menu">菜单</a>
      </nav>
    </header>

    <div class="backdrop" aria-hidden="true"></div>

    <main class="page">
      <div class="card" id="menu">
        <div class="sheet-body">
          <ul class="menu">
            <li>
              <details>
                <summary><span class="title">项目笔记</span></summary>
                <ul class="sub">
                  <li>
                    <a href="projectNote/engineeringIndex.html">工程项目</a>
                  </li>
                  <li><a href="projectNote/studyIndex.html">学习项目</a></li>
                </ul>
              </details>
            </li>
            <li>
              <details>
                <summary><span class="title">项目实例</span></summary>
                <ul class="sub">
                  <li><a href="">项目体验(未开通)</a></li>
                  <li><a href="">项目源码(未开通)</a></li>
                </ul>
              </details>
            </li>
            <li>
              <details>
                <summary><span class="title">技术笔记</span></summary>
                <ul class="sub">
                  <li><a href="technicalNote/frontendIndex.html">前端</a></li>
                  <li><a href="technicalNote/backendIndex.html">后端</a></li>
                  <li><a href="technicalNote/mlIndex.html">机器学习</a></li>
                </ul>
              </details>
            </li>
            <li>
              <details>
                <summary><span class="title">其他</span></summary>
                <ul class="sub">
                  <li>
                    <a
                      class="latest-article"
                      href="https://github.com/yiyamiaowu/yiyamiaowu.github.io/commits/main"
                      target="_blank"
                      rel="noopener"
                      >最新文章</a
                    >
                  </li>
                  <li>
                    <a href="../doc/maintenance_log.html">维护日志</a>
                  </li>
                  <li>
                    <a href="../doc/hello_world.html">Hello World</a>
                  </li>
                </ul>
              </details>
            </li>
          </ul>
        </div>
      </div>
    </main>

    <a class="back-to-top" href="#top">
      回到顶部 <span aria-hidden="true">↑</span>
    </a>

    <script>
      (() => {
        const toTop = document.querySelector(".back-to-top");
        if (!toTop) return;

        let shown = false;
        let queued = false;

        const update = () => {
          const shouldShow =
            (window.scrollY || document.documentElement.scrollTop) > 24;
          if (shouldShow === shown) return;
          shown = shouldShow;
          toTop.classList.toggle("is-visible", shouldShow);
        };

        const onScroll = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            update();
          });
        };

        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("pageshow", update);
        update();
      })();
    </script>

    <script>
      (() => {
        const link = document.querySelector(".latest-article");
        if (!link) return;

        const REPO = "yiyamiaowu/yiyamiaowu.github.io";
        const BRANCH = "main";
        const PAGES_BASE = "https://yiyamiaowu.github.io/";
        /* 各类文章所在的目录，自动找其中最新的一篇 */
        const FOLDERS = [
          "doc/frontend_technicalnote",
          "doc/backend_technicalnote",
          "doc/ml_technicalnote",
          "doc/engineering_project",
          "doc/study_project",
        ];
        const CACHE_KEY = "latest-article-cache";
        const CACHE_TTL = 5 * 60 * 1000;

        const pageUrl = (filePath) =>
          PAGES_BASE + filePath.split("/").map(encodeURIComponent).join("/");

        const getJSON = async (url) => {
          const response = await fetch(url, {
            headers: { Accept: "application/vnd.github+json" },
          });
          if (!response.ok) throw new Error(String(response.status));
          return response.json();
        };

        const latestInFolder = async (folder) => {
          const commits = await getJSON(
            `https://api.github.com/repos/${REPO}/commits?sha=${BRANCH}&path=${encodeURIComponent(folder)}&per_page=1`,
          );
          const commit = commits && commits[0];
          if (!commit) return null;

          const detail = await getJSON(
            `https://api.github.com/repos/${REPO}/commits/${commit.sha}`,
          );
          const prefix = folder.replace(/\/+$/, "") + "/";
          const files = (detail.files || []).filter(
            (file) =>
              file.filename.startsWith(prefix) &&
              /\.html$/i.test(file.filename) &&
              !/(^|\/)(index|maintenanceLog)\.html$/i.test(file.filename) &&
              file.status !== "removed",
          );
          if (!files.length) return null;

          const article =
            files.find((file) => file.status === "added") || files[0];
          return {
            path: article.filename,
            time: new Date(commit.commit.committer.date).getTime(),
          };
        };

        const resolveLatest = async () => {
          const results = await Promise.all(
            FOLDERS.map((folder) => latestInFolder(folder).catch(() => null)),
          );
          const newest = results
            .filter(Boolean)
            .sort((a, b) => b.time - a.time)[0];
          return newest ? pageUrl(newest.path) : null;
        };

        const apply = (url) => {
          if (!url) return;
          link.href = url;
          try {
            sessionStorage.setItem(
              CACHE_KEY,
              JSON.stringify({ url, time: Date.now() }),
            );
          } catch {
            /* 隐私模式下 sessionStorage 可能不可用 */
          }
        };

        let cached = null;
        try {
          const raw = sessionStorage.getItem(CACHE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            if (Date.now() - data.time < CACHE_TTL) cached = data.url;
          }
        } catch {
          cached = null;
        }

        if (cached) {
          link.href = cached;
          return;
        }

        resolveLatest()
          .then(apply)
          .catch(() => {});
      })();
    </script>
  </body>
</html>
